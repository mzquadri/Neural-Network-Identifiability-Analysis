name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: The symmetry verification reproduces
        run: python -m src.symmetry_verification

      - name: Artifacts present and README agrees with the run
        run: python scripts/check_repository.py

      - name: Figures regenerate
        run: python scripts/figures/generate_figures.py
